<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/PAGINA PRINCIPAL/CSS/login.css">
    <link rel="shortcut icon" href="/IMAGENS PRINCIPAIS/Logo Kabett Music.png" type="image/x-icon">
</head>

<body>

    <main>

        <section class="section_main">

            <div class="div_logo">

                <img src="/IMAGENS PRINCIPAIS/Logo Kabett Music.png" alt="logo kabett music">

            </div>

            <div class="div_mainInput">

                <div class="div_h1">

                    <h1>Login</h1>

                </div>

                <div class="div_inputs">

                    <div>
                        
                        <label for="text">Nome do usuario</label>
                        <input type="text" class="input_text" name="" id="usuario" placeholder="User Name">

                    </div>

                    <div>

                        <label for="password">Senha</label>
                        <input type="password" class="input_password" name="" id="senha" placeholder="Password" onkeydown="enter(event)">

                    </div>

                    <div>

                        <input type="button" class="input_butt" value="LOGIN" onclick="butLogin()">

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="/PAGINA PRINCIPAL/JAVASCRIPT/login.js"></script>

</body>

</html>
